name: Windows-Paket

# Baut das portable ZIP (Python + Pakete + transit) und haengt es an das Release an.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: exopipeline-windows
          path: dist/*.zip
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
