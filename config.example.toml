# Beispielkonfiguration fuer das Werkzeug "transit".
# Kopieren nach config.local.toml und dort die eigenen Werte eintragen (config.local.toml wird nicht ins Git aufgenommen).
# Pro Messung ueberschreibt RESULT\transit.toml einzelne Werte (gleiche Abschnitte/Namen).

[site]                      # leer = aus FITS-Header (SITELAT/SITELONG/SITEELEV)
lat = 48.0                  # Breite in Grad (Nord positiv)
lon = 15.0                  # Laenge in Grad (Ost positiv)
elev = 300.0                # Hoehe in m

[camera]
gain_e_per_adu = 0.25       # Elektronen pro ADU (Wert der eigenen Kamera beim verwendeten Gain)
readnoise_e = 1.2
saturation_adu = 60000      # Frames/Sterne darueber werden verworfen (Linearitaet < 0.2 % bis hier geprueft)
linearity_warn_adu = 45000  # nur Warnung
pixel_um = 3.76             # Pixelgroesse ungebinnt (fuer ASTAP, falls XPIXSZ im Header fehlt)
focal_mm = 1090             # Brennweite (fuer ASTAP, falls FOCALLEN im Header fehlt)
farbkamera = "auto"         # "auto" = Bayer-Bilder (BAYERPAT im Header) in 2x2-Superpixeln messen | "ja" | "nein"

[gaia]
quelle = "vizier"           # Gaia DR3 ueber "vizier" (CDS, I/355/gaiadr3) oder "esa" (ESA-Gaia-Archiv)
timeout_s = 60              # Wartezeit pro Abfrage in Sekunden
# vizier_server = ["vizier.cfa.harvard.edu", "vizier.iucaa.in", "vizier.china-vo.org", "vizier.cds.unistra.fr"]
#                             # Reihenfolge der VizieR-Server (Gaia und VSX); nicht erreichbare kommen danach ans Ende

[photometry]
radii = [8, 10, 12, 14, 16, 18, 20, 22, 24]
annulus = [25, 40]
centroid_box = 15
reference_radius = 16
aperture_mode = "beides"    # "fest" = feste Radien (search.radii) | "variabel" = mitwachsend k x FWHM | "beides" = beide treten an
k_fwhm = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0]   # mitwachsende Apertur: Radius pro Bild = k x FWHM (Median der Vergleichssterne)
fwhm_smooth = 5             # laufender Median ueber so viele Bilder (FWHM-Rauschen nicht in den Radius tragen)

[comps]
dmag_bright = -0.5          # Kandidat darf hoechstens 0.5 mag heller sein als das Ziel
dmag_faint = 2.0
edge_px = 80
neighbour_px = 40
neighbour_dmag = 3.0
color_tol = 0.5             # |BP-RP Kandidat - BP-RP Ziel|
max_candidates = 30
gaia_gmax = 16.0
aij_apertures = ""          # optional: AIJ .apertures-Datei, deren Vergleichssterne mit aufgenommen werden
exclude_stars = []          # Kandidaten nie verwenden, z. B. ["G06"] (veraenderlich); am besten in RESULT\<lauf>\lauf.toml
katalog_variable = true     # bekannte Veraenderliche (Gaia-Flag VARIABLE, AAVSO VSX) gar nicht erst als Kandidaten nehmen
vsx_radius_arcsec = 5.0     # Abstand fuer die Zuordnung eines VSX-Eintrags zum Gaia-Stern

[search]
radii = [14, 16, 18, 20]
n_min = 3
n_max = 12
top = 50
oot_margin_min = 10
prefilter_sigma = 3.0
variab_check = true         # Lichtkurve jedes Vergleichssterns gegen die uebrigen pruefen (vergleichssterne_lc.png), variable verwerfen
variab_sigma = 3.0          # "variabel" ab Streuung der variab_bin_min-Mittel > n x Median aller Kandidaten ...
variab_beta = 1.5           # ... und rotem Rauschen (beta) ueber diesem Wert
variab_bin_min = 10         # Mittelungsfenster [min] fuer die Kurzzeit-Variabilitaet
airmass_max = 0             # > 0: Frames ueber dieser Airmass weglassen (Randpunkte mit starker Systematik), 0 = alle
symmetry_weight = 0         # > 0: Ensemble-Suche bevorzugt um das Ziel symmetrisch verteilte Sterne (Meridian-Flip), z. B. 1
einzel_tiefe_sigma = 0      # Einzelstern-Test (jeder Vergleichsstern allein): 0 = nur anzeigen; z. B. 3 = Sterne, deren Rp/R* allein > 3 sigma
                            # vom Median aller Sterne UND vom Literaturwert abweicht, nicht in die Ensemble-Suche
tiefen_gewicht = 0          # > 0: unter den Top-Ensembles gewinnt eher eines, dessen Rp/R* zum Literaturwert passt (Score x (1 + w (z/3)^2))
# ensemble = ["G03", "G08", "G12"]   # Vergleichssterne von Hand: keine Ensemble-Suche, Vermerk in Ergebnisblatt und
                            # ExoClock-Kommentar. Normalerweise ueber die Oberflaeche setzen (Ergebnis -> Vergleichssterne
                            # -> Haken -> "Als neuen Lauf rechnen"). Handbuch: "Vergleichssterne von Hand waehlen".

[fit]
u1 = 0.40
u2 = 0.25
fix_geometry = true         # a/R*, i aus ExoClock festhalten (empfohlen bei Einzelnaechten)
flip = "prior"              # prior | free | none
flip_window_h = [-0.85, 0.85]  # Fenster um den Flip fuer die Versatz-Messung an Vergleichssternen
mcmc_steps = 30000
airmass_order = 1           # Detrending in Airmass: 1 = linear, 2 = quadratisch
mcmc_chains = 0             # parallele MCMC-Ketten; 0 = automatisch (bis 16, je >= 2000 Schritte), 1 = eine Kette wie frueher
weights = "none"            # "none" = alle Bilder gleich genau; "modell" = Fehler pro Bild aus Szintillation (Airmass, Belichtung) + Photonen
aperture_cm = 15.0          # Teleskopoeffnung fuer das Szintillationsmodell (z. B. 15 cm)
detrend_fwhm = false        # zusaetzlicher Detrending-Term FWHM (Seeing/Fokus); nur wenn der BIC besser wird
ausreisser_sigma = 0        # 0 = aus; z. B. 3: Frames, deren Abweichung vom Transit-Fit > 3 sigma ist, werden entfernt (iterativ)
tc_profil_min = 60          # Tc-Profil ("Ist Tc eindeutig?"): Fit bei festem Tc im Raster +- so viele Minuten um die Vorhersage
tc_zweites_tal = 4          # Warnung, wenn ein zweites Tal im Tc-Profil weniger als so viel (Delta-chi2 / beta^2) schlechter ist

[calib]
library = 'C:\Photometry\calibration'
mode = "bf"                 # raw | bf (Bias+Flat) | bfd (Bias+Flat+skalierter Dark)
master_dir = ""             # leer = automatisch passendes Master-Set suchen

[paths]
archiv_wurzel = '\\NAS\share\Photometry\done'   # NAS: hier wird (rekursiv) zusaetzlich zu ...\auto nach Messungen gesucht
astap = 'C:\Program Files\astap\astap_cli.exe'

[planning]
flip_min_before_ingress_h = 1.0
baseline_min_h = 1.0
airmass_max_baseline = 2.0
# transit plan (Beobachtungsvorschlag)
naechte = 3                 # so viele Naechte ab heute
alt_min = 10.0              # Mindesthoehe (Horizont): Transit + halbe Baseline muessen darueber liegen
sonne_max = -12.0           # Dunkelheit: Sonne tiefer als das (-12 nautisch, -18 astronomisch)
tiefe_snr_min = 3.0         # Transittiefe mindestens so oft das erwartete Rauschen eines 10-min-Bins
rauschboden_ppt = 1.0       # systematischer Rauschboden pro 10-min-Bin (Erfahrungswert, an eigene Messungen anpassen)
himmel_mag = 20.0           # Himmelshelligkeit am Standort in mag/arcsec2 (SQM-Wert)
tastgrad = 0.8              # Anteil Belichtungszeit an der Gesamtzeit (Download, Dithern, Guiding)
exoclock_oeffnung = true    # nur Planeten, deren ExoClock-Mindestoeffnung <= fit.aperture_cm ist
prioritaeten = ["alert", "high", "medium", "low"]
mond_abstand_min = 30.0     # Warnung, wenn der (mind. 30 % beleuchtete) Mond naeher steht (Grad)
wetter = true               # Bewoelkungsvorhersage von Open-Meteo (Standort auf 0.1 Grad gerundet)
bewoelkung_gut = 20         # mittlere Bewoelkung im Beobachtungsfenster bis hier: gruen
bewoelkung_max = 60         # bis hier gelb, darueber rot
sensor_px = [6248, 4176]    # Sensorgroesse in Pixeln (fuer das Gesichtsfeld)

[progress]
status_interval_s = 10      # so oft wird RESULT\<lauf>\status.json geschrieben (Lebenszeichen)
hang_after_s = 120          # aelter -> transit status meldet "haengt? JA"
toast = false               # Windows-Benachrichtigung am Ende jedes Befehls (wie --toast)

[run]
workers = 0                 # parallele Prozesse; 0 = Kerne - 2 (PC bleibt bedienbar), 1 = seriell
cube_workers = 8            # Obergrenze fuer die Photometrie (RAM: ca. 0.4 GB pro Prozess mit Flat)

[observer]                  # fuer die Fusszeile des Ergebnisblatts; leer = aus dem FITS-Header
name = "Your Name"
telescope = ""              # leer = TELESCOP aus dem Header
camera = ""                 # leer = INSTRUME aus dem Header

[report]
bin_min = 10                # Mittelwert-Bins der Lichtkurve auf dem Ergebnisblatt (Minuten)

[export]
filter = ""                 # Filter fuer ExoClock, falls der FITS-Header kein FILTER hat (z. B. "L"); leer = aus dem Header

